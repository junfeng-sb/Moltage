[project]
name = "moltage"
version = "0.2.1"
description = "Single-molecule quantum transport and analysis workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "Junfeng Lin" },
]
keywords = [
    "molecular electronics",
    "quantum transport",
    "FHI-aims",
    "ORCA",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "keyring",
    "paramiko",
    "PySide6",
    "vtk",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/junfeng-sb/Moltage"
Repository = "https://github.com/junfeng-sb/Moltage"
Issues = "https://github.com/junfeng-sb/Moltage/issues"
