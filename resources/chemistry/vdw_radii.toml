license = "CC-BY-4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
units = "angstrom"
original_units = "bohr"
radius_definition = "Free-atom equilibrium van der Waals radius computed from the element's recommended dipole polarizability using the source model."
coverage = "atomic numbers 1-83 inclusive, excluding Pm (Z=61)"
curation_note = "Moltage selects the Table S1 central R_free_vdW[alpha] value for each target element, converts bohr to angstrom with the 2022 CODATA factor 0.529177210544 angstrom/bohr, rounds to six decimal places, and excludes Pm to preserve the existing supported element set. Canonical symbols for Z=64 and Z=67 are normalized by atomic number from typographic variants in Table S1. Parenthetical source uncertainties are not represented by the runtime scalar-radius interface. These free-atom radii are heuristic steric inputs, not universal bonded-atom contact distances."
conversion_reference = "2022 CODATA Bohr radius, NIST Standard Reference Database 121"
conversion_url = "https://physics.nist.gov/cuu/pdf/wall_2022.pdf"
attribution_note = "Adapted from Charry Martinez and Tkatchenko under CC BY 4.0; Moltage changed units, precision, symbols at Z=64 and Z=67, and selected coverage."

