title = "Free-atom equilibrium van der Waals radii for elements Z=1-83 except Pm"
citation = "J. A. Charry Martinez and A. Tkatchenko, Van der Waals Radii of Free and Bonded Atoms From Hydrogen (Z=1) to Oganesson (Z=118), ChemRxiv, Version 2 (2024)."
doi = "10.26434/chemrxiv-2024-m3rtp-v2"
source_url = "https://doi.org/10.26434/chemrxiv-2024-m3rtp-v2"
source_version = "ChemRxiv Version 2, 2024-05-28"
